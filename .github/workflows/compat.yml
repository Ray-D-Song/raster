name: Compatibility

on:
  pull_request:
  workflow_dispatch:

jobs:
  rust-unit:
    name: rust-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test -p v8_compat --lib
      - run: cargo test -p raster_runtime_napi --lib

  sanitizer:
    name: sanitizer-${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: rustup target add x86_64-unknown-linux-gnu --toolchain nightly
      - name: Run sanitizer gate
        run: bash v8_compat/tools/run_sanitizer_ci.sh ${{ matrix.sanitizer }}

  v8-abi:
    name: v8-abi-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
      - run: bash v8_compat/tools/check_abi.sh

  v8-clippy:
    name: v8-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy -p v8_compat --all-targets -- -D warnings

  napi-clippy:
    name: napi-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy -p raster_runtime_napi --all-targets -- -D warnings

  mysql-compat:
    name: mysql-compat
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - run: rustup toolchain install nightly
      - name: Build raster_runtime
        run: cargo +nightly build
      - run: make compat-mysql
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-mysql-logs
          path: compat/mysql2/compat.log
          if-no-files-found: ignore

  compatibility:
    name: ${{ matrix.case }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: napi-hello
            os: macos-latest
          - case: next
            os: ubuntu-latest
          - case: vite-plus
            os: ubuntu-latest
          - case: better-sqlite3
            os: ubuntu-latest
          - case: better-sqlite3
            os: macos-latest
          - case: v8-hello
            os: ubuntu-latest
          - case: v8-hello
            os: macos-latest
          - case: v8-hello
            os: macos-15-intel
          - case: better-sqlite3
            os: ubuntu-24.04-arm
          - case: v8-hello
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ (matrix.case == 'better-sqlite3' || matrix.case == 'v8-hello') && '24.3.0' || '22.18.0' }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - run: rustup toolchain install nightly
      - name: Build raster_runtime
        run: |
          FEATURES=""
          if [ "${{ matrix.case }}" = "napi-hello" ]; then FEATURES="--features napi"; fi
          if [ "${{ matrix.case }}" = "better-sqlite3" ] || [ "${{ matrix.case }}" = "v8-hello" ]; then FEATURES="--features v8-compat"; fi
          cargo +nightly build $FEATURES
      - run: make compat-${{ matrix.case }}
      - if: always()
        run: |
          ./target/debug/raster_runtime --version || true
          find compat/${{ matrix.case }} -maxdepth 4 -type f | sort
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.case }}-logs
          path: |
            compat/${{ matrix.case }}/compat.log
            compat/${{ matrix.case }}/.next
            compat/${{ matrix.case }}/dist
          if-no-files-found: ignore
