name: Compatibility

on:
  pull_request:
  workflow_dispatch:
    inputs:
      case_filter:
        description: Run cases whose names contain this keyword (empty runs all)
        required: false
        type: string
        default: ""

jobs:
  rust-unit:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('rust-unit-tests', inputs.case_filter) }}
    name: rust-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-unit
          # The workspace crates dominate this job (raster_runtime_modules alone is
          # ~5 min), and rust-cache drops non-dependency artifacts by default.
          cache-workspace-crates: "true"
          # A red run still leaves reusable artifacts; keep them for the next try.
          cache-on-failure: "true"
      - run: cargo fmt --all -- --check
      - run: cargo test -p v8_compat --lib
      - run: cargo test -p raster_runtime_napi --lib -- --test-threads=1
      - run: cargo test -p raster_runtime_events --lib
      - run: cargo test -p raster_runtime_tty --lib
      - run: cargo test -p raster_runtime_modules --lib
      - run: cargo test -p raster_runtime_util --lib
      - run: cargo test -p raster_runtime_fs --lib
      - run: cargo test -p raster_runtime_sqlite --all-targets
      - run: make js JS_MINIFY=0
      - name: Build raster_runtime (napi) for JS unit gates
        run: cargo build -p raster_runtime --features napi
      - name: JS unit gates
        env:
          RASTER_RUNTIME_ASYNC_HOOKS: "1"
        run: |
          for filter in events readline util worker_threads module fs sqlite; do
            ./target/debug/raster_runtime test -d bundle/js/__tests__/unit --filter "$filter"
          done

  windows-sqlite:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('windows-sqlite', inputs.case_filter) }}
    name: windows-sqlite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-sqlite
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - name: Build raster_runtime and sqlite extension
        run: |
          cargo build -p raster_runtime
          $env:CC = "clang"
          node compat/node-sqlite/build-extension.mjs
          Remove-Item Env:CC
          if (-not (Test-Path compat/node-sqlite/build/sqlite_extension.dll)) {
            throw "missing compat/node-sqlite/build/sqlite_extension.dll"
          }
      - name: JS sqlite unit tests
        run: ./target/debug/raster_runtime.exe test -d bundle/js/__tests__/unit --filter sqlite
      - name: Parity differential (Raster only on Windows CI)
        env:
          COMPAT_SKIP_NODE_BASELINE: "1"
          COMPAT_SQLITE_LIFECYCLE_LOOPS: "5"
          COMPAT_SQLITE_BACKUP_LOOPS: "2"
        run: node compat/run.mjs node-sqlite target/debug/raster_runtime.exe

  windows-tty-napi:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('windows-tty-napi', inputs.case_filter) }}
    name: windows-tty-napi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-tty-napi
      - name: Build and test TTY + N-API + FS (Windows)
        run: |
          cargo test -p raster_runtime_tty --lib
          cargo test -p raster_runtime_napi --lib -- --test-threads=1
          cargo test -p raster_runtime_fs --lib
          cargo clippy -p raster_runtime_fs -p raster_runtime_napi --all-targets --no-deps -- -D warnings
          cargo build -p raster_runtime --features napi

  sanitizer:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('sanitizer-address sanitizer-undefined', inputs.case_filter) }}
    name: sanitizer-${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.case_filter == 'sanitizer-address' && '["address"]' || github.event_name == 'workflow_dispatch' && inputs.case_filter == 'sanitizer-undefined' && '["undefined"]' || '["address","undefined"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.sanitizer == 'address' && 'nightly' || 'stable' }}
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sanitizer-${{ matrix.sanitizer }}
          # run_sanitizer_ci.sh redirects CARGO_TARGET_DIR to this path.
          workspaces: ". -> target-sanitizer-${{ matrix.sanitizer }}"
      - name: Run sanitizer gate
        run: bash v8_compat/tools/run_sanitizer_ci.sh ${{ matrix.sanitizer }}

  v8-abi:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('v8-abi-drift', inputs.case_filter) }}
    name: v8-abi-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
      - run: bash v8_compat/tools/check_abi.sh

  v8-clippy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('v8-clippy', inputs.case_filter) }}
    name: v8-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Registry only: this gate is short, and the repo's 10 GB cache budget is
          # better spent on the target dirs of the long jobs.
          shared-key: cargo-registry
          cache-targets: "false"
      - run: cargo clippy -p v8_compat --all-targets -- -D warnings

  napi-clippy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('napi-clippy', inputs.case_filter) }}
    name: napi-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Registry only: short gate, see v8-clippy.
          shared-key: cargo-registry
          cache-targets: "false"
      - run: >
          cargo clippy
          -p raster_runtime_napi
          -p raster_runtime_events
          -p raster_runtime_tty
          -p raster_runtime_modules
          -p raster_runtime_fs
          -p raster_runtime_util
          -p raster_runtime_sqlite
          --all-targets --no-deps -- -D warnings

  sqlite-asan:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('sqlite-asan', inputs.case_filter) }}
    name: sqlite-asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sqlite-asan
          # run-asan.sh redirects CARGO_TARGET_DIR to this path.
          workspaces: ". -> target-sqlite-asan"
      - run: yarn install --frozen-lockfile
      - run: bash compat/node-sqlite/run-asan.sh

  mysql-compat:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('mysql-compat', inputs.case_filter) }}
    name: mysql-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mysql-compat
      - name: Build raster_runtime
        run: cargo build -p raster_runtime
      - run: make compat-mysql
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-mysql-logs
          path: compat/mysql2/compat.log
          if-no-files-found: ignore

  postgres-compat:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('node-postgres-compat', inputs.case_filter) }}
    name: node-postgres-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-postgres-compat
      - name: Build raster_runtime
        run: cargo build -p raster_runtime
      - run: make compat-node-postgres
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-node-postgres-logs
          path: compat/node-postgres/compat.log
          if-no-files-found: ignore

  compatibility:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.case_filter == '' || contains('napi-hello next vite-plus better-sqlite3 v8-hello node-sqlite', inputs.case_filter) }}
    name: ${{ matrix.case }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: napi-hello
            os: macos-latest
          - case: next
            os: ubuntu-latest
          - case: vite-plus
            os: ubuntu-latest
          - case: vite-plus
            os: macos-latest
          - case: better-sqlite3
            os: ubuntu-latest
          - case: better-sqlite3
            os: macos-latest
          - case: v8-hello
            os: ubuntu-latest
          - case: v8-hello
            os: macos-latest
          - case: v8-hello
            os: macos-15-intel
          - case: better-sqlite3
            os: ubuntu-24.04-arm
          - case: v8-hello
            os: ubuntu-24.04-arm
          - case: node-sqlite
            os: ubuntu-latest
          - case: node-sqlite
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node 24.3 source
        if: matrix.case == 'v8-hello' || matrix.case == 'better-sqlite3'
        run: |
          git submodule sync -- refs/node
          git submodule update --init --depth 1 refs/node
          test "$(git -C refs/node rev-parse HEAD)" = \
            "741975041995a272ff7e378bcbb6d6fa4b93f38f"
          grep -q '#define NODE_MAJOR_VERSION 24' refs/node/src/node_version.h
          grep -q '#define NODE_MINOR_VERSION 3' refs/node/src/node_version.h
      - uses: actions/setup-node@v4
        with:
          # Vite+ / Next install with Node 22.18 (not system 24.3). V8 fixtures pin 24.3 ABI.
          node-version: ${{ (matrix.case == 'better-sqlite3' || matrix.case == 'v8-hello' || matrix.case == 'node-sqlite') && '24.3.0' || '22.18.0' }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make js JS_MINIFY=0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: compatibility
          # Keyed by feature set, not matrix case: entries differ only in enabled
          # features, and per-case keys would multiply caches past the repo's
          # 10 GB cache budget.
          key: ${{ matrix.os }}-${{ (matrix.case == 'napi-hello' || matrix.case == 'vite-plus') && 'napi' || (matrix.case == 'better-sqlite3' || matrix.case == 'v8-hello') && 'v8-compat' || 'default' }}
      - name: Build raster_runtime
        run: |
          FEATURES=""
          if [ "${{ matrix.case }}" = "napi-hello" ] || [ "${{ matrix.case }}" = "vite-plus" ]; then FEATURES="--features napi"; fi
          if [ "${{ matrix.case }}" = "better-sqlite3" ] || [ "${{ matrix.case }}" = "v8-hello" ]; then FEATURES="--features v8-compat"; fi
          if [ "${{ matrix.case }}" = "node-sqlite" ]; then FEATURES=""; fi
          cargo build -p raster_runtime $FEATURES
          if [ "$RUNNER_OS" = "Linux" ] &&
             { [ "${{ matrix.case }}" = "v8-hello" ] ||
               [ "${{ matrix.case }}" = "better-sqlite3" ]; }; then
            nm -D --defined-only target/debug/raster_runtime |
              c++filt |
              grep -F "v8::Isolate::GetCurrent()"

            nm -D --defined-only target/debug/raster_runtime |
              c++filt |
              grep -F "v8::Context::GetIsolate()"
          fi
      - name: Run compatibility fixture
        env:
          COMPAT_VP_VERSION_LOOPS: ${{ matrix.case == 'vite-plus' && '100' || '0' }}
          COMPAT_VP_BUILD_LOOPS: ${{ matrix.case == 'vite-plus' && '20' || '0' }}
          COMPAT_SQLITE_LIFECYCLE_LOOPS: ${{ matrix.case == 'node-sqlite' && '100' || '0' }}
          COMPAT_SQLITE_BACKUP_LOOPS: ${{ matrix.case == 'node-sqlite' && '20' || '0' }}
          COMPAT_BETTER_SQLITE3_LOOPS: ${{ matrix.case == 'better-sqlite3' && '20' || '0' }}
        run: make compat-${{ matrix.case }}
      - if: always()
        run: |
          ./target/debug/raster_runtime --version || true
          find compat/${{ matrix.case }} -maxdepth 4 -type f | sort
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.case }}-${{ matrix.os }}-logs
          path: |
            compat/${{ matrix.case }}/compat.log
            compat/${{ matrix.case }}/.next
            compat/${{ matrix.case }}/dist
          if-no-files-found: ignore
