[package]
name = "raster_runtime_napi"
description = "Node-API (N-API) native addon support for raster_runtime"
version = "0.8.1-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ray-d-song/raster_runtime"

[lib]
name = "raster_runtime_napi"
path = "src/lib.rs"

[features]
default = []
v8-compat = ["dep:v8_compat"]

[dependencies]
v8_compat = { path = "../../v8_compat", optional = true }
libc = { version = "0.2", default-features = false }
libloading = { version = "0.8", default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }
parking_lot = { version = "0.12", default-features = false }
raster_runtime_context = { path = "../../libs/raster_runtime_context", default-features = false }
raster_runtime_utils = { path = "../../libs/raster_runtime_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["std", "futures", "parallel"], default-features = false }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread"], default-features = false }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
raster_runtime_test = { path = "../../libs/raster_runtime_test" }
# `time` for bounded driver teardown waits in unit tests (tokio::time::timeout).
tokio = { version = "1", features = ["macros", "rt", "time"], default-features = false }
