[package]
name = "raster_runtime_tls"
description = "raster_runtime Module tls"
version = "0.8.1-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ray-d-song/raster_runtime"
readme = "README.md"

[lib]
name = "raster_runtime_tls"
path = "src/lib.rs"

[features]
default = ["webpki-roots", "tls-ring"]

webpki-roots = ["dep:webpki-roots"]
native-roots = ["dep:rustls-native-certs"]

# TLS crypto backend features (rustls-based)
tls-ring = [
  "dep:rustls",
  "rustls/ring",
  "dep:tokio-rustls",
  "dep:rustls-webpki",
]
tls-aws-lc = [
  "dep:rustls",
  "rustls/aws_lc_rs",
  "dep:tokio-rustls",
  "dep:rustls-webpki",
]
tls-graviola = [
  "dep:rustls",
  "dep:rustls-graviola",
  "dep:tokio-rustls",
  "dep:rustls-webpki",
]

# OpenSSL TLS backend
tls-openssl = ["dep:openssl", "dep:tokio-openssl"]

[dependencies]
idna = { version = "1", default-features = false, features = ["alloc", "compiled_data"] }
once_cell = { version = "1", features = ["std"], default-features = false }
raster_runtime_buffer = { version = "0.8.1-beta", path = "../raster_runtime_buffer" }
raster_runtime_context = { version = "0.8.1-beta", path = "../../libs/raster_runtime_context" }
raster_runtime_events = { version = "0.8.1-beta", path = "../raster_runtime_events" }
raster_runtime_net = { version = "0.8.1-beta", path = "../raster_runtime_net" }
raster_runtime_stream = { version = "0.8.1-beta", path = "../raster_runtime_stream" }
raster_runtime_utils = { version = "0.8.1-beta", path = "../../libs/raster_runtime_utils", default-features = false }
rquickjs = { version = "=0.12.1", default-features = false }
rustls = { version = "0.23", features = [
  "std",
  "tls12",
], default-features = false, optional = true }
rustls-graviola = { version = "0.3", default-features = false, optional = true }
rustls-webpki = { version = "0.102", default-features = false, optional = true, features = [
  "alloc",
  "ring",
  "std",
] }
openssl = { version = "0.10", optional = true }
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
], default-features = false }
tokio-openssl = { version = "0.6", optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false }
webpki-roots = { version = "1", default-features = false, optional = true }
rustls-native-certs = { version = "0.8", default-features = false, optional = true }
x509-parser = { version = "0.16", default-features = false }

[dev-dependencies]
raster_runtime_events = { path = "../raster_runtime_events" }
raster_runtime_test = { path = "../../libs/raster_runtime_test" }
raster_runtime_net = { path = "../raster_runtime_net" }
raster_runtime_test_tls = { path = "../../libs/raster_runtime_test_tls", features = ["tls-ring"] }
