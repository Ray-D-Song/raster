[package]
name = "raster_runtime_worker_threads"
description = "raster_runtime worker_threads native support"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "raster_runtime_worker_threads"
path = "src/lib.rs"

[dependencies]
raster_runtime_context = { version = "0.1.0", path = "../../libs/raster_runtime_context" }
raster_runtime_utils = { version = "0.1.0", path = "../../libs/raster_runtime_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["std"], default-features = false }
tokio = { version = "1", features = ["sync"], default-features = false }
tracing = { version = "0.1", default-features = false }
