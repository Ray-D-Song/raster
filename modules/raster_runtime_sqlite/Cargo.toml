[package]
name = "raster_runtime_sqlite"
description = "raster_runtime Module node:sqlite"
version = "0.8.1-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ray-d-song/raster_runtime"
readme = "README.md"

[lib]
name = "raster_runtime_sqlite"
path = "src/lib.rs"

[dependencies]
raster_runtime_buffer = { version = "0.8.1-beta", path = "../raster_runtime_buffer" }
raster_runtime_context = { version = "0.8.1-beta", path = "../../libs/raster_runtime_context" }
raster_runtime_url = { version = "0.8.1-beta", path = "../raster_runtime_url" }
raster_runtime_process = { version = "0.8.1-beta", path = "../raster_runtime_process", default-features = false }
raster_runtime_utils = { version = "0.8.1-beta", path = "../../libs/raster_runtime_utils", default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }
rquickjs = { version = "=0.12.1", features = ["either"], default-features = false }
tokio = { version = "1", features = ["rt", "sync"], default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[build-dependencies]
cc = "1"

[dev-dependencies]
raster_runtime_test = { path = "../../libs/raster_runtime_test" }
tokio = { version = "1", features = ["macros", "rt"] }
