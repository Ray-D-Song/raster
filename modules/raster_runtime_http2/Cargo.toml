[package]
name = "raster_runtime_http2"
description = "raster_runtime Module http2"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ray-d-song/raster_runtime"

[lib]
name = "raster_runtime_http2"
path = "src/lib.rs"

[features]
default = ["tls-ring"]
tls-ring = ["raster_runtime_tls/tls-ring"]
tls-aws-lc = ["raster_runtime_tls/tls-aws-lc"]
tls-graviola = ["raster_runtime_tls/tls-graviola"]
tls-openssl = ["raster_runtime_tls/tls-openssl"]

[dependencies]
bytes = { version = "1", default-features = false }
http = "1"
http-body-util = { version = "0.1", default-features = false }
h2 = "0.4"
hyper = { version = "1", features = ["client", "http2"], default-features = false }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "tokio", "http2"], default-features = false }
raster_runtime_buffer = { version = "0.1.0", path = "../raster_runtime_buffer" }
raster_runtime_context = { version = "0.1.0", path = "../../libs/raster_runtime_context" }
raster_runtime_events = { version = "0.1.0", path = "../raster_runtime_events" }
raster_runtime_tls = { version = "0.1.0", default-features = false, path = "../raster_runtime_tls" }
raster_runtime_timers = { version = "0.1.0", path = "../raster_runtime_timers" }
raster_runtime_utils = { version = "0.1.0", path = "../../libs/raster_runtime_utils", default-features = false }
rquickjs = { version = "=0.12.1", features = ["either", "std"], default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"], default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }

[dev-dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
raster_runtime_async_hooks = { path = "../raster_runtime_async_hooks" }
raster_runtime_test = { path = "../../libs/raster_runtime_test" }
raster_runtime_test_tls = { path = "../../libs/raster_runtime_test_tls", features = ["tls-ring"] }
rustls = { version = "0.23", features = ["std", "tls12", "ring"], default-features = false }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false }
