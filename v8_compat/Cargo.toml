[package]
name = "v8_compat"
description = "QuickJS-backed V8/Node C++ ABI shim for raster_runtime"
version = "0.8.1-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ray-d-song/raster_runtime"
links = "raster_v8"
build = "build.rs"

[lib]
name = "v8_compat"
path = "src/lib.rs"

[dependencies]
libc = { version = "0.2", default-features = false }
once_cell = { version = "1", features = ["std"], default-features = false }
parking_lot = { version = "0.12", default-features = false }
rquickjs = { version = "=0.12.1", features = ["std"], default-features = false }
tracing = { version = "0.1", default-features = false }

[build-dependencies]
cc = "1"
